name: Build fork image

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Source commit to build from main
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false

      - name: Prepare image name
        id: metadata
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "image=ghcr.io/${REPOSITORY_OWNER,,}/sub2api" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.image }}:sha-${{ steps.metadata.outputs.commit }}
          build-args: |
            COMMIT=${{ steps.metadata.outputs.commit }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.commit }}
          cache-from: type=gha,scope=fork-image-amd64
          cache-to: type=gha,mode=max,scope=fork-image-amd64
