name: Sync upstream and build image

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build main even when upstream has no new commits
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.merge.outputs.commit }}
      build: ${{ steps.merge.outputs.build }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # Upstream merges can modify .github/workflows, which GITHUB_TOKEN cannot push.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Merge upstream production into main
        id: merge
        env:
          FORCE: ${{ inputs.force }}
          HAS_UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash .github/scripts/sync-upstream.sh

      - name: Check upstream sync automation
        run: python3 .github/scripts/test_upstream_sync.py

      - name: Set up Go
        if: steps.merge.outputs.build == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check backend integration and fork regressions
        if: steps.merge.outputs.build == 'true'
        working-directory: backend
        run: |
          go build ./cmd/server
          go test -tags=unit ./internal/service ./internal/repository ./internal/handler ./internal/handler/admin ./migrations \
            -run 'Test(Pool|.*Pool|OpenAIQuota|CNProvider|.*Cline|.*CommandCode|.*Zhipu|.*HTTP2|.*HTTPUpstream|.*UpstreamBilling|.*AccountExtra|OpenAIResponsesWebSocket_.*BeforeFirstMessageIsInfo|PriorityAnalysisConcurrentScopesHaveBoundedSQLReaders|LockAndMergeAccountProbeExtra)' -count=1

      - name: Set up pnpm
        if: steps.merge.outputs.build == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        if: steps.merge.outputs.build == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Check frontend integration and fork regressions
        if: steps.merge.outputs.build == 'true'
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm test:run src/views/admin/ops/components/__tests__/OpsConcurrencyPoolQuota.spec.ts \
            src/components/account/__tests__/CNProviderQuotaCell.spec.ts \
            src/views/admin/__tests__/UsageView.spec.ts

      - name: Push updated main
        if: steps.merge.outputs.build == 'true'
        run: git push origin HEAD:refs/heads/main

      - name: Save upstream sync diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-sync-diagnostics
          path: ${{ runner.temp }}/upstream-sync/
          if-no-files-found: ignore
          retention-days: 14

  image:
    needs: sync
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-fork-image.yml
    with:
      ref: ${{ needs.sync.outputs.commit }}
      force: ${{ inputs.force == true }}
