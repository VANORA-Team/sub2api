name: Sync upstream and build image

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build main even when upstream has no new commits
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.merge.outputs.commit }}
      build: ${{ steps.merge.outputs.build }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # Upstream merges can modify .github/workflows, which GITHUB_TOKEN cannot push.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Merge upstream production into main
        id: merge
        env:
          FORCE: ${{ inputs.force }}
          HAS_UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/ranxi2001/sub2api.git production
          upstream=$(git rev-parse FETCH_HEAD)
          before=$(git rev-parse HEAD)
          build=false
          if ! git merge-base --is-ancestor "$upstream" HEAD; then
            if ! git merge --no-edit "$upstream"; then
              echo "::error::Upstream conflicts with main. Resolve the merge while retaining the fork changes; main has not been pushed."
              exit 1
            fi
            build=true
          elif [[ "$FORCE" == "true" ]]; then
            build=true
          fi
          if [[ "$HAS_UPSTREAM_SYNC_TOKEN" != "true" ]] && ! git diff --quiet "$before" HEAD -- .github/workflows; then
            echo "::error::Upstream changes workflow files. Configure the UPSTREAM_SYNC_TOKEN Actions secret with Contents and Workflows write permissions for this repository; GITHUB_TOKEN cannot push these changes. Main has not been pushed."
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Upstream production: $upstream" >> "$GITHUB_STEP_SUMMARY"
          echo "Main source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        if: steps.merge.outputs.build == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check backend integration and fork regressions
        if: steps.merge.outputs.build == 'true'
        working-directory: backend
        run: |
          go build ./cmd/server
          go test -tags=unit ./internal/service ./internal/repository ./internal/handler/admin ./migrations \
            -run 'Test(Pool|.*Pool|OpenAIQuota|CNProvider|.*Cline|.*CommandCode|.*Zhipu|.*HTTP2|.*HTTPUpstream|.*UpstreamBilling|.*AccountExtra)' -count=1

      - name: Set up pnpm
        if: steps.merge.outputs.build == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        if: steps.merge.outputs.build == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Check frontend integration and fork regressions
        if: steps.merge.outputs.build == 'true'
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm test:run src/views/admin/ops/components/__tests__/OpsConcurrencyPoolQuota.spec.ts \
            src/components/account/__tests__/CNProviderQuotaCell.spec.ts \
            src/views/admin/__tests__/UsageView.spec.ts

      - name: Push updated main
        if: steps.merge.outputs.build == 'true'
        run: git push origin HEAD:refs/heads/main

  image:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-fork-image.yml
    with:
      ref: ${{ needs.sync.outputs.commit }}
